<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览、检查和筛选 R2R、RxR 视觉语言导航数据，查看场景俯视图、GT 轨迹和多语言指令。">
  <title>VLN Atlas · 导航数据浏览器</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="brand"><img src="./favicon.svg" width="38" height="38" alt=""><div><h1>VLN Atlas</h1><p>导航数据浏览器</p></div></div>
    <div class="header-end"><span id="catalog-date">正在连接数据目录…</span><button id="export" class="primary" disabled>导出筛选清单</button></div>
  </header>
  <div id="notice" class="notice" role="status" hidden></div>
  <main>
    <section class="stats" aria-label="当前筛选统计">
      <div><span>指令样本</span><strong id="stat-records">—</strong></div>
      <div><span>参考路线</span><strong id="stat-routes">—</strong></div>
      <div><span>Scan 场景</span><strong id="stat-scenes">—</strong></div>
      <div><span>可生成 GT 视频</span><strong id="stat-media">—</strong></div>
      <div><span>平均参考路径</span><strong id="stat-length">—</strong></div>
    </section>
    <details class="video-coverage" id="video-coverage">
      <summary id="video-progress">R2R / RxR 视频整理进度</summary>
      <div id="video-coverage-table"></div>
    </details>
    <form id="filters" class="filters" aria-label="样本筛选">
      <label class="search"><span>搜索指令 / Episode / 路线 / Scan</span><input name="q" type="search" placeholder="例如 turn left、15、zsNo4HB9uLZ" autocomplete="off"></label>
      <label><span>数据集</span><select name="dataset"><option value="">全部数据集</option></select></label>
      <label><span>划分 Split</span><select name="split"><option value="">全部划分</option></select></label>
      <label><span>语言</span><select name="language"><option value="">全部语言</option></select></label>
      <label><span>角色</span><select name="role"><option value="">全部角色</option></select></label>
      <details class="more-filters"><summary>更多筛选</summary><div class="extra-filters">
        <label><span>数据版本</span><select name="source_id"><option value="">全部版本</option></select></label>
        <label><span>Scan 场景</span><select name="scene"><option value="">全部场景</option></select></label>
        <label><span>参考路径最短 / 米</span><input name="min_length" type="number" min="0" step="0.1" placeholder="不限"></label>
        <label><span>参考路径最长 / 米</span><input name="max_length" type="number" min="0" step="0.1" placeholder="不限"></label>
        <label><span>LeRobot GT 视频</span><select name="media"><option value="">全部</option><option value="yes">有对应观测</option><option value="no">暂无对应观测</option></select></label>
        <label><span>标注检查</span><select name="quality"><option value="">全部</option><option value="complete">指令、路径、目标齐全</option><option value="issues">存在缺失字段</option></select></label>
      </div></details>
      <button id="reset" type="button">查看全部</button>
    </form>
    <div class="workspace">
      <aside class="directory panel"><div class="panel-heading"><h2>数据目录</h2><span>数据集 / 划分 / 场景</span></div><nav id="directory" aria-label="数据目录"><p class="muted">正在加载…</p></nav><p class="directory-note">目录数字为全量计数。语言和角色可在上方筛选。</p></aside>
      <section class="samples panel" aria-label="指令样本列表">
        <div class="panel-heading"><h2>指令样本</h2><span id="result-count" aria-live="polite">正在加载…</span></div>
        <div id="sample-list" class="sample-list" aria-busy="true"></div>
        <div class="pagination"><button id="previous" disabled>上一页</button><span id="page-info">—</span><button id="next" disabled>下一页</button></div>
      </section>
      <section id="detail" class="detail panel" aria-label="样本详情"><div class="empty"><h2>选择一条导航指令</h2><p>查看场景俯视图、GT 轨迹和样本来源。</p></div></section>
    </div>
  </main>
  <footer>原始标注只读 · 视频来自 LeRobot GT，按 8 Hz 播放 · 评测轨迹来自数据集 GT · 俯视底图来自场景 NavMesh</footer>
</body>
</html>
